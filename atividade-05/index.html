<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Usuário</title>
  <!-- CSS EXTERNO (incorporação externa) -->
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <div class="janela">

    <div class="barra-titulo">
      Cadastro de Usuário
    </div>

    <form>

      <fieldset>
        <legend>Dados Pessoais</legend>

        <div class="campo">
          <label for="nome">Nome <span class="obrigatorio">*</span></label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
        </div>

        <div class="campo">
          <label for="sobrenome">Sobrenome <span class="obrigatorio">*</span></label>
          <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite seu sobrenome">
        </div>

        <div class="campo">
          <label for="email">E-mail <span class="obrigatorio">*</span></label>
          <input type="text" id="email" name="email" placeholder="exemplo@email.com">
        </div>

        <div class="campo">
          <label for="telefone">Telefone</label>
          <input type="text" id="telefone" name="telefone" placeholder="(00) 00000-0000">
        </div>

        <div class="campo">
          <label for="nascimento">Data de Nascimento</label>
          <input type="date" id="nascimento" name="nascimento">
        </div>
      </fieldset>

      <fieldset>
        <legend>Endereço</legend>

        <div class="campo">
          <label for="rua">Rua</label>
          <input type="text" id="rua" name="rua" placeholder="Nome da rua">
        </div>

        <div class="campo">
          <label for="numero">Número</label>
          <input type="text" id="numero" name="numero" placeholder="123">
        </div>

        <div class="campo">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" name="cidade" placeholder="Sua cidade">
        </div>

        <div class="campo">
          <label for="estado">Estado</label>
          <input type="text" id="estado" name="estado" placeholder="BA">
        </div>

        <div class="campo">
          <label for="cep">CEP</label>
          <input type="text" id="cep" name="cep" placeholder="00000-000">
        </div>
      </fieldset>

      <fieldset>
        <legend>Preferências</legend>

        <div class="campo">
          <label for="cor">Cor Favorita</label>
          <select id="cor" name="cor">
            <option>Vermelho</option>
            <option>Azul</option>
            <option>Verde</option>
            <option>Amarelo</option>
            <option>Preto</option>
            <option>Branco</option>
          </select>
        </div>

        <div class="campo">
          <label>Gênero</label>
          <div class="opcoes">
            <label class="opcao">
              <input type="radio" value="m" name="genero"> Masculino
            </label>
            <label class="opcao">
              <input type="radio" value="f" name="genero"> Feminino
            </label>
          </div>
        </div>

        <div class="campo">
          <label>Interesses</label>
          <div class="opcoes">
            <label class="opcao">
              <input type="checkbox" value="esportes" name="interesses"> Esportes
            </label>
            <label class="opcao">
              <input type="checkbox" value="musica" name="interesses"> Música
            </label>
            <label class="opcao">
              <input type="checkbox" value="tecnologia" name="interesses"> Tecnologia
            </label>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Anexos</legend>

        <div class="campo">
          <label for="arquivo">Escolha um arquivo</label>
          <input type="file" id="arquivo" name="arquivo">
        </div>
      </fieldset>

      <fieldset>
        <legend>Informações de Login</legend>

        <div class="campo">
          <label for="usuario">Nome de Usuário <span class="obrigatorio">*</span></label>
          <input type="text" id="usuario" name="usuario" placeholder="seu.usuario">
        </div>

        <div class="campo">
          <label for="senha">Senha <span class="obrigatorio">*</span></label>
          <input type="password" id="senha" name="senha" placeholder="Mínimo 8 caracteres">
        </div>

        <div class="campo">
          <label for="confirmar">Confirmar Senha <span class="obrigatorio">*</span></label>
          <input type="password" id="confirmar" name="confirmar" placeholder="Repita a senha">
        </div>
      </fieldset>

      <div class="rodape">
        <span class="legenda-obrigatorio"><span class="obrigatorio">*</span> Campos obrigatórios</span>
        <input type="reset" value="Cancelar">
        <input type="submit" value="Salvar">
      </div>

    </form>

  </div>

</body>
</html>
