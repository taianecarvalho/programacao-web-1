<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hotel Pet - sistema de gerenciamento de estadia de pets.">
  <title>Login - Hotel Pet</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body class="login">

  <main>

    <figure>
      <img src="imagens/fachada.jpg" alt="Dois cães correndo na área de lazer do Hotel Pet">
    </figure><section>

      <h1>Hotel Pet</h1>

      <form action="pets.html" method="get">

        <div>
          <label>Login
            <input type="text" name="login" placeholder="Login" required>
          </label>
        </div>

        <div>
          <label>Senha
            <input type="password" name="senha" placeholder="Senha" required>
          </label>
          <button type="button" class="olho"><img src="imagens/icone-olho.svg" alt="Mostrar senha"></button>
        </div>

        <div class="linha">
          <label class="marcador">
            <input type="checkbox" name="conectado"> Matenha-me conectado
          </label>
          <a href="recuperar-senha.html">Esqueci a senha</a>
        </div>

        <button type="submit">Enviar</button>

      </form>

      <p>ou</p>

      <nav class="sociais">
        <ul>
          <li><a href="#"><img src="imagens/icone-facebook.svg" alt="Entrar com Facebook"></a></li>
          <li><a href="#"><img src="imagens/icone-twitter.svg" alt="Entrar com Twitter"></a></li>
          <li><a href="#"><img src="imagens/icone-google.svg" alt="Entrar com Google"></a></li>
        </ul>
      </nav>

      <p><a href="criar-conta.html">Criar uma conta</a></p>

    </section>

  </main>

</body>
</html>
